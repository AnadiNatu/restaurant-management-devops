# ==========================================================
# ACTIVE PROFILE
# ==========================================================
#spring.profiles.active=prod

# ==========================================================
# DATABASE
# ==========================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ==========================================================
# JWT
# ==========================================================
jwt.secret=${JWT_SECRET}

# ==========================================================
# FRONTEND / CORS
# ==========================================================
app.frontend.url=https://restaurant.andiwebsolutions.com
app.cors.allowed-origins=https://restaurant.andiwebsolutions.com

# ==========================================================
# MAIL
# ==========================================================
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# ==========================================================
# OAUTH2
# ==========================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

app.oauth2.redirect-uri=https://restaurant.andiwebsolutions.com/oauth2/callback

# ==========================================================
# TEST USERS
# ==========================================================
app.test-users.enabled=false

# ==========================================================
# AWS / S3
# ==========================================================
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
cloud.aws.region.static=${AWS_REGION:ap-south-1}
aws.bucket.name=${AWS_BUCKET_NAME}