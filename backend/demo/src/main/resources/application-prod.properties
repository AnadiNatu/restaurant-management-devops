# ==========================================================
# ACTIVE PROFILE
# ==========================================================
#spring.profiles.active=prod

# ==========================================================
# DATABASE
# ==========================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# jdbc:postgresql://restaurant-database.c7e6uqeyamel.ap-south-1.rds.amazonaws.com:5432/RestaurantDB
# ==========================================================
# JWT
# ==========================================================
jwt.secret=${JWT_SECRET}

# ==========================================================
# FRONTEND / CORS
# ==========================================================
app.frontend.url=${FRONTEND_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ==========================================================
# MAIL
# ==========================================================
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# ==========================================================
# OAUTH2
# ==========================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI}

# ==========================================================
# TEST USERS
# ==========================================================
app.test-users.enabled=false

# ==========================================================
# AWS / S3
# ==========================================================
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
cloud.aws.region.static=${AWS_REGION:ap-south-1}
aws.bucket.name=${AWS_BUCKET_NAME}

# =========================================================
# PRODUCTION RESTAURANT GST CONFIGURATION
# =========================================================

restaurant.tx.default-rate=${RESTAURANT_GST_RATE:5.00}
restaurant.tx.input-tax-credit-allowed=${RESTAURANT_ITC_ALLOWED:false}

restaurant.tx.gstin=${RESTAURANT_GSTIN:}
restaurant.tx.legal-name=${RESTAURANT_LEGAL_NAME:}
restaurant.tx.trade-name=${RESTAURANT_TRADE_NAME:}

restaurant.tx.address=${RESTAURANT_ADDRESS:}
restaurant.tx.city=${RESTAURANT_CITY:}
restaurant.tx.state=${RESTAURANT_STATE:}
restaurant.tx.state-code=${RESTAURANT_STATE_CODE:}
restaurant.tx.postal-code=${RESTAURANT_POSTAL_CODE:}

restaurant.tx.sac=${RESTAURANT_SAC:996331}
restaurant.tx.supplier-state-code=${RESTAURANT_SUPPLIER_STATE_CODE:}