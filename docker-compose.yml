services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-RestaurantDB}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # Bind locally only; don't expose PostgreSQL to the public internet.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - restaurant_postgres_data:/var/lib/postgresql/data
      # Scripts in this directory run only when the data volume is first initialized.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [restaurant_net]

  backend:
    build:
      context: ./backend/demo
      dockerfile: Dockerfile
    image: restaurant-management-backend:local
    container_name: restaurant_backend
    restart: unless-stopped
    environment:
     SPRING_PROFILES_ACTIVE: local
     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-RestaurantDB}
     SPRING_DATASOURCE_USERNAME: ${POSTGRES_USERNAME:-postgres}
     SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
     POSTGRES_HOST: postgres
     POSTGRES_PORT: ${POSTGRES_PORT}
     POSTGRES_DB: ${POSTGRES_DB:-RestaurantDB}
     POSTGRES_USERNAME: ${POSTGRES_USERNAME:-postgres}
     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
     DB_URL: ${DB_URL}
     DB_USERNAME: ${DB_USERNAME}
     DB_PASSWORD: ${DB_PASSWORD}
     JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
     MAIL_USERNAME: ${MAIL_USERNAME}
     MAIL_PASSWORD: ${MAIL_PASSWORD}
     GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
     GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
     FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
     CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
     OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI:-http://localhost/login/oauth2/code/google}
     AWS_REGION: ${AWS_REGION:-ap-south-1}
     AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}
     AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
     AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
     TEST_USERS_ENABLED: ${TEST_USERS_ENABLED:-false}
     RESTAURANT_GST_RATE: ${RESTAURANT_GST_RATE:-18}
     RESTAURANT_ITC_ALLOWED: ${RESTAURANT_ITC_ALLOWED:-false}
     RESTAURANT_GSTIN: ${RESTAURANT_GSTIN:-GSTIN123456789}
     RESTAURANT_LEGAL_NAME: ${RESTAURANT_LEGAL_NAME:-Sample Legal Name}
     RESTAURANT_TRADE_NAME: ${RESTAURANT_TRADE_NAME:-Sample Trade Name}
     RESTAURANT_ADDRESS: ${RESTAURANT_ADDRESS:-Sample Address, Sample Street, Lucknow}
     RESTAURANT_CITY: ${RESTAURANT_CITY:-Lucknow}
     RESTAURANT_STATE: ${RESTAURANT_STATE:-U.P}
     RESTAURANT_STATE_CODE: ${RESTAURANT_STATE_CODE:-UP}
     RESTAURANT_POSTAL_CODE: ${RESTAURANT_POSTAL_CODE:-226001}
     RESTAURANT_SAC: ${RESTAURANT_SAC:-SAC996331}
     RESTAURANT_SUPPLIER_STATE_CODE: ${RESTAURANT_SUPPLIER_STATE_CODE:-SSC123456789}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [restaurant_net]

  frontend:
    build:
      context: ./frontend/restaurant-ui
      dockerfile: Dockerfile
    image: restaurant-ui:local
    container_name: restaurant_frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [restaurant_net]

volumes:
  restaurant_postgres_data:

networks:
  restaurant_net:
    driver: bridge
