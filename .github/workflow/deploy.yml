name: Build and Deploy Restaurant Management

on:

  push:

    branches:
      - main


env:

  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}


jobs:

  # ========================================================
  # BACKEND
  # ========================================================

  build-backend:

    name: Build Backend

    runs-on: ubuntu-latest

    defaults:

      run:
        working-directory: backend/restaurant-management


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup JDK 21
        uses: actions/setup-java@v4

        with:

          java-version: '21'

          distribution: temurin

          cache: maven


      - name: Build Backend
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests -q


  # ========================================================
  # FRONTEND
  # ========================================================

  build-frontend:

    name: Build Frontend

    runs-on: ubuntu-latest

    defaults:

      run:
        working-directory: frontend/restaurant-ui


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:

          node-version: '20'

          cache: npm

          cache-dependency-path: frontend/restaurant-ui/package-lock.json


      - name: Install dependencies
        run: npm ci


      - name: Build Angular
        run: npm run build -- --configuration production


  # ========================================================
  # DEPLOY
  # ========================================================

  deploy:

    name: Deploy to EC2

    needs:
      - build-backend
      - build-frontend

    runs-on: ubuntu-latest


    steps:

      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1

        with:

          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USER }}

          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            cd ~/restaurant-management-app/devops

            git pull origin main

            docker compose \
              -f docker-compose.prod.yml \
              --env-file .env.prod \
              pull

            docker compose \
              -f docker-compose.prod.yml \
              --env-file .env.prod \
              up -d \
              --remove-orphans

            docker image prune -f