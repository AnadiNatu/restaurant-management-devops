<div class="auth-card animate-up">
      <div class="auth-header">
        <h2>Welcome back</h2>
        <p>Sign in to your account to continue.</p>
      </div>
 
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-group">
          <label class="form-label">Email address</label>
          <input class="form-control"
                 type="email"
                 formControlName="email"
                 placeholder="you@restaurant.com"
                 autocomplete="email" />
          @if (email.invalid && email.touched) {
            <span class="form-error">⚠ Enter a valid email</span>
          }
        </div>
 
        <div class="form-group" style="margin-top:1rem">
          <label class="form-label">Password</label>
          <div class="password-wrapper">
            <input class="form-control"
                   [type]="showPass() ? 'text' : 'password'"
                   formControlName="password"
                   placeholder="••••••••"
                   autocomplete="current-password" />
            <button type="button" class="pass-toggle"
                    (click)="showPass.set(!showPass())">
              {{ showPass() ? '🙈' : '👁' }}
            </button>
          </div>
          @if (password.invalid && password.touched) {
            <span class="form-error">⚠ Password required</span>
          }
        </div>
 
        <div class="forgot-row">
          <a routerLink="/auth/forgot-password">Forgot password?</a>
        </div>
 
        <button class="btn btn-primary w-full submit-btn"
                type="submit"
                [disabled]="loading()">
          @if (loading()) { <span class="spinner"></span> }
          {{ loading() ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>
 
      <p class="auth-footer">
        New to Bistro Hub?
        <a routerLink="/auth/register">Create an account</a>
      </p>
    </div>
