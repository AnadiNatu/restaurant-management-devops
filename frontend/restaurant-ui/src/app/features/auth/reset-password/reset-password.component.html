  <div class="auth-card animate-up">
      <div class="auth-header">
        <h2>New password</h2>
        <p>Enter your reset token and choose a new password.</p>
      </div>
 
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-group">
          <label class="form-label">Reset token</label>
          <input class="form-control" formControlName="token" placeholder="Paste token from email" />
        </div>
        <div class="form-group">
          <label class="form-label">New password</label>
          <input class="form-control" type="password" formControlName="newPassword"
                 placeholder="At least 8 characters" />
          @if (form.controls.newPassword.invalid && form.controls.newPassword.touched) {
            <span class="form-error">⚠ Minimum 8 characters</span>
          }
        </div>
        <button class="btn btn-primary w-full" style="margin-top:1.25rem;height:46px"
                type="submit" [disabled]="loading()">
          @if (loading()) { <span class="spinner"></span> }
          {{ loading() ? 'Resetting...' : 'Reset Password' }}
        </button>
      </form>
 
      <p class="auth-footer">
        <a routerLink="/auth/login">← Back to login</a>
      </p>
    </div>
