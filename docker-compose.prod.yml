services:
  backend:
    image: anadinatu/restaurant-management-backend:latest
    container_name: restaurant_backend
    restart: unless-stopped
    environment:
     SPRING_PROFILES_ACTIVE: prod

     POSTGRES_HOST: ${POSTGRES_HOST:?Set production RDS hostname}
     POSTGRES_PORT: ${POSTGRES_PORT:-5432}
     POSTGRES_DB: ${POSTGRES_DB:?Set production database name}
     POSTGRES_USERNAME: ${POSTGRES_USERNAME:?Set production database username}
     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set production database password}
     JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
     MAIL_USERNAME: ${MAIL_USERNAME:?Set MAIL_USERNAME}
     MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD}
     GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
     GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET}
     FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
     CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
     OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI:?Set OAUTH2_REDIRECT_URI}
     AWS_REGION: ${AWS_REGION:-ap-south-1}
     AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:?Set AWS_BUCKET_NAME}
     AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
     AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
     TEST_USERS_ENABLED: ${TEST_USERS_ENABLED}
     RESTAURANT_GST_RATE: ${RESTAURANT_GST_RATE:-18}
     RESTAURANT_ITC_ALLOWED: ${RESTAURANT_ITC_ALLOWED:-false}
     RESTAURANT_GSTIN: ${RESTAURANT_GSTIN:-GSTIN123456789}
     RESTAURANT_LEGAL_NAME: ${RESTAURANT_LEGAL_NAME:-Sample Legal Name}
     RESTAURANT_TRADE_NAME: ${RESTAURANT_TRADE_NAME:-Sample Trade Name}
     RESTAURANT_ADDRESS: ${RESTAURANT_ADDRESS:-Sample Address, Sample Street, Lucknow}
     RESTAURANT_CITY: ${RESTAURANT_CITY:-Lucknow}
     RESTAURANT_STATE: ${RESTAURANT_STATE:-U.P}
     RESTAURANT_STATE_CODE: ${RESTAURANT_STATE_CODE:-UP}
     RESTAURANT_POSTAL_CODE: ${RESTAURANT_POSTAL_CODE:-226001}
     RESTAURANT_SAC: ${RESTAURANT_SAC:-SAC996331}
     RESTAURANT_SUPPLIER_STATE_CODE: ${RESTAURANT_SUPPLIER_STATE_CODE:-SSC123456789}
     JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [restaurant_net]

  frontend:
    image: anadinatu/restaurant-ui:latest
    container_name: restaurant_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./frontend/restaurant-ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [restaurant_net]

networks:
  restaurant_net:
    driver: bridge
