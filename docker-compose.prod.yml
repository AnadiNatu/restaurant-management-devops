services:

  # ========================================================
  # BACKEND
  # ========================================================

  backend:

    image: anadinatu/restaurant-management-backend:latest

    container_name: restaurant_backend

    restart: unless-stopped

    environment:

      # Spring profile
      SPRING_PROFILES_ACTIVE: docker

      # ----------------------------------------------------
      # DATABASE
      # ----------------------------------------------------

      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # ----------------------------------------------------
      # JWT
      # ----------------------------------------------------

      JWT_SECRET: ${JWT_SECRET}

      # ----------------------------------------------------
      # MAIL
      # ----------------------------------------------------

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      # ----------------------------------------------------
      # GOOGLE OAUTH2
      # ----------------------------------------------------

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # ----------------------------------------------------
      # FRONTEND
      # ----------------------------------------------------

      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI}

      # ----------------------------------------------------
      # AWS S3
      # ----------------------------------------------------

      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

      # ----------------------------------------------------
      # TEST USERS
      # ----------------------------------------------------

      TEST_USERS_ENABLED: ${TEST_USERS_ENABLED:-false}

      # ----------------------------------------------------
      # JVM
      # ----------------------------------------------------

      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"


    ports:

      - "8080:8080"


    healthcheck:

      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health || exit 1"
        ]

      interval: 30s

      timeout: 10s

      retries: 5

      start_period: 60s


    networks:
      - restaurant_net


  # ========================================================
  # FRONTEND
  # ========================================================

  frontend:

    image: anadinatu/restaurant-ui:latest

    container_name: restaurant_frontend

    restart: unless-stopped

    volumes:

      - /etc/letsencrypt:/etc/letsencrypt:ro


    ports:

      - "80:80"
      - "443:443"


    depends_on:

      backend:
        condition: service_healthy


    networks:
      - restaurant_net


# ==========================================================
# NETWORK
# ==========================================================

networks:

  restaurant_net:

    driver: bridge